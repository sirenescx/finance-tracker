{% extends "base.html" %}
{% block content %}
<h1>Monthly budgets</h1><p>Leave a value empty when there is no budget for that category.</p><form method="post" class="budget-grid"><section class="income-budget"><div class="income-budget-heading"><h2>Expenses</h2><span>PER MONTH</span></div>{% for category in expense_categories %}<label class="income-budget-row"><span class="income-budget-category">{{ category }}</span><span class="income-budget-amount"><span aria-hidden="true">€</span><input aria-label="Monthly {{ category }} budget in euros" type="number" min="0" step="0.01" name="budget_expense_{{ category }}" value="{{ budgets.get('expense', {}).get(category, '') }}" placeholder="0.00"></span></label>{% endfor %}</section><section class="income-budget"><div class="income-budget-heading"><h2>Income</h2><span>PER MONTH</span></div>{% for category in income_categories %}<label class="income-budget-row"><span class="income-budget-category">{{ category }}</span><span class="income-budget-amount"><span aria-hidden="true">€</span><input aria-label="Monthly {{ category }} budget in euros" type="number" min="0" step="0.01" name="budget_income_{{ category }}" value="{{ budgets.get('income', {}).get(category, '') }}" placeholder="0.00"></span></label>{% endfor %}</section><button>Save budgets</button></form>
{% endblock %}
